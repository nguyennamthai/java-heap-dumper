apiVersion: v1
kind: ServiceAccount
metadata:
  name: gc-operator
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gc-operator
rules:
  - apiGroups: ["hivecpq"]
    resources: ["heapdumpers"]
    verbs: ["list", "watch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gc-operator
subjects:
  - kind: ServiceAccount
    name: gc-operator
    namespace: default
roleRef:
  kind: ClusterRole
  name: gc-operator
  apiGroup: rbac.authorization.k8s.io

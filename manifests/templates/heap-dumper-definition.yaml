apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: heapdumpers.hivecpq
spec:
  group: hivecpq
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                selector:
                  type: object
                  additionalProperties:
                    type: string
                thresholdGb:
                  type: number
            status:
              type: object
              properties:
                targetPod:
                  type: string
                injected:
                  type: boolean
  scope: Namespaced
  names:
    plural: heapdumpers
    singular: heapdumper
    kind: HeapDumper
    shortNames:
      - hd
